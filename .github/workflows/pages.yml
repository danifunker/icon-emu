# Build the WebAssembly page and publish it to GitHub Pages.
# The Rel 2.11 boot ROM donated by vintagecomputer.ca is copied in from its
# release (rom-rel2.11) for the page's "Download ROM" button; it is never in git.
name: Pages

on:
  push:
    branches: [main]
    # Documentation-only pushes don't change the site.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

# Every JavaScript action runs on Node 24 (Node 20 is deprecated on the runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo build --release -p icon-web --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --no-typescript --out-dir web/pkg target/wasm32-unknown-unknown/release/icon_web.wasm
      - name: Assemble the site
        run: |
          mkdir -p site/rom
          # GitHub release downloads have no CORS headers, so the page fetches its own copy.
          curl -fsSL -o site/rom/icon1_rom_rel2.11_combined.bin https://github.com/danifunker/icon-emu/releases/download/rom-rel2.11/icon1_rom_rel2.11_combined.bin
          echo "3750cf6f203fe1a167b853e36d30114701b039eb  site/rom/icon1_rom_rel2.11_combined.bin" | sha1sum -c -
          scripts/web-version.sh
          cp -R web/index.html web/app.js web/version.json web/manifest.webmanifest web/icons web/pkg site/
          cp disks/hd64-factory.bin site/rom/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
