[package]
name = "icon-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The ICON kept local time: turning its file dates into host times needs the time zone.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
icon-core = { path = "../icon-core" }
serde_json = "1"

[[bin]]
name = "icon-cli"
path = "src/main.rs"

[[bin]]
name = "icon-ci"
path = "src/bin/icon_ci.rs"
