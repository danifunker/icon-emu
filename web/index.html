<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEXICON Emulator</title>
<style>
  :root { --bg: #1b1d21; --panel: #2a2d33; --text: #e8e6e1; --muted: #9a978f; --amber: #f2a33a; --led: #ffd23f; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1340px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .machine { background: var(--panel); border-radius: 10px; padding: 16px; display: inline-block; }
  .bezel { background: #111; padding: 18px; border-radius: 18px; box-shadow: inset 0 0 12px #000; }
  canvas { display: block; width: 960px; height: 720px; max-width: 100%; height: auto; aspect-ratio: 4 / 3;
           image-rendering: pixelated; background: #000; border-radius: 6px; }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button { background: #3a3e46; color: var(--text); border: 1px solid #555; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button.power.on { background: var(--amber); color: #222; border-color: var(--amber); }
  .led { width: 12px; height: 12px; border-radius: 50%; background: #4a4220; display: inline-block; }
  .led.on { background: var(--led); box-shadow: 0 0 8px var(--led); }
  .file .btn { background: #3a3e46; border: 1px solid #555; border-radius: 6px; padding: 6px 14px; cursor: pointer; display: inline-block; }
  .muted { color: var(--muted); }
  #status { font-family: ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>LEXICON fileserver console (5053 ISS 2 boot ROM)</h1>
  <div class="machine">
    <div class="bezel"><canvas id="screen" width="640" height="240"></canvas></div>
    <div class="controls">
      <button id="power" class="power">Power</button>
      <label class="file"><input id="floppy" type="file" accept=".img" hidden><span class="btn">Load floppy…</span></label>
      <span id="floppy-name" class="muted">no diskette</span>
      <span>trouble <span id="led" class="led"></span></span>
      <span id="status">off</span>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
